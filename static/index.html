<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Research Agent</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e3e2dc;
    --accent: #d9581e; --accent-text: #ffffff; --user: #efeee8; --ok: #2f7d4f; --bad: #b3261e; --warn-bg: #fff4e0;
    --code-bg: #f1f0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --text: #ecebe6; --muted: #9a9a92; --line: #33332e;
      --accent: #ee7a3d; --accent-text: #161614; --user: #2a2a26; --ok: #5cc88a; --bad: #ff8a80; --warn-bg: #3a2f1a;
      --code-bg: #2a2a26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  #status { color: var(--muted); font-size: 12px; flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); padding: 6px 12px;
  }
  button:hover { border-color: var(--muted); }
  #banner { background: var(--warn-bg); color: var(--text); padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }
  #banner[hidden], [hidden] { display: none !important; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  #empty { max-width: 820px; margin: 8vh auto 0; }
  #empty h2 { font-size: 20px; margin: 0 0 6px; }
  #empty p { color: var(--muted); margin: 0 0 16px; }
  .presets { display: grid; gap: 8px; }
  .presets button { text-align: left; padding: 10px 14px; }
  .msg { max-width: 820px; margin: 0 auto 18px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .bubble { background: var(--user); padding: 9px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .body p { margin: 0 0 10px; } .body h3, .body h4, .body h5, .body h6 { margin: 16px 0 6px; line-height: 1.3; }
  .body h3 { font-size: 17px; } .body h4 { font-size: 15.5px; } .body h5, .body h6 { font-size: 14.5px; }
  .body ul, .body ol { margin: 0 0 10px; padding-left: 22px; } .body li { margin: 2px 0; }
  .body code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .body pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .body pre code { padding: 0; background: none; }
  .body blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .body a { color: var(--accent); } .body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .table-wrap { overflow-x: auto; margin: 0 0 12px; }
  table { border-collapse: collapse; font-size: 13.5px; }
  th, td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
  th { background: var(--code-bg); font-weight: 600; }
  details.tools, details.sources { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; user-select: none; }
  .tool-list, .source-list { list-style: none; margin: 6px 0 0; padding: 0; }
  .tool { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .tool .icon { width: 14px; text-align: center; flex: none; }
  .tool.ok .icon { color: var(--ok); } .tool.fail .icon, .tool.fail .detail { color: var(--bad); }
  .tool.running .icon { animation: pulse 1s ease-in-out infinite; }
  .tool .label { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); overflow-wrap: anywhere; }
  .tool .ms, .tool .detail { font-size: 12px; white-space: nowrap; }
  @keyframes pulse { 50% { opacity: .25; } }
  .source-list li { padding: 2px 0; } .source-list a { color: var(--accent); }
  .src-meta { color: var(--muted); } .also { margin-top: 8px; font-size: 12px; }
  .notice { background: var(--warn-bg); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 13px; margin: 0 0 8px; }
  .notice.error { border-left: 3px solid var(--bad); }
  .meta { color: var(--muted); font-size: 12px; min-height: 1em; }
  #composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; max-height: 200px; line-height: 1.4;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; min-width: 68px; padding: 9px 14px; }
  #send.stop { background: var(--panel); color: var(--text); border-color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>NBA Research Agent</h1>
  <span id="status"></span>
  <button id="new-chat" type="button">New chat</button>
</header>
<div id="banner" hidden></div>

<main id="log">
  <div id="empty">
    <h2>Ask about a game, a player, an injury or a prop.</h2>
    <p>Stats come from Hardwood; news and injuries come from the web, with sources.</p>
    <div class="presets">
      <button type="button" data-prompt="What's the injury situation for tonight's games?">What's the injury situation for tonight's games?</button>
      <button type="button" data-prompt="Walk me through today's points props board: lines, hit rates and matchups.">Walk me through today's points props board</button>
      <button type="button" data-prompt="Who are the top 10 scorers this season, and how are they trending over their last 5 games?">Top 10 scorers and how they're trending over their last 5</button>
      <button type="button" data-prompt="Compare the Knicks and Celtics: net rating, pace, and what each defense allows to guards.">Compare the Knicks and Celtics</button>
    </div>
  </div>
</main>

<form id="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="Ask anything about the NBA… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
